<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register | VenueHub</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><a href="index.html" class="logo">Venue<span>Hub</span></a><nav><a href="index.html">Home</a><a href="venues.html">Venues</a><a href="login.html">Login</a></nav></header><main class="auth-page"><div class="auth-card"><div class="auth-header"><div class="auth-logo">VH</div><h1>Create your account</h1><p>Join VenueHub as a customer or venue owner.</p></div><form id="registerForm"><div class="form-row"><div class="form-group"><label for="firstName">First Name <span class="required-star" aria-hidden="true">*</span></label><input type="text" id="firstName" name="firstName" autocomplete="given-name" minlength="2" maxlength="80" pattern="[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ '-]*" title="Use letters, spaces, apostrophes or hyphens." required></div><div class="form-group"><label for="lastName">Last Name <span class="required-star" aria-hidden="true">*</span></label><input type="text" id="lastName" name="lastName" autocomplete="family-name" minlength="2" maxlength="80" pattern="[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ '-]*" title="Use letters, spaces, apostrophes or hyphens." required></div></div><div class="form-group"><label for="email">Email Address <span class="required-star" aria-hidden="true">*</span></label><input type="email" id="email" name="email" autocomplete="email" maxlength="160" required></div><div class="form-group"><label for="phone">Mobile Number <span class="required-star" aria-hidden="true">*</span></label><input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" pattern="[+0-9() .-]{10,20}" minlength="10" maxlength="20" title="Enter a valid phone number, including country code if needed." required></div><div class="form-group"><label for="accountType">Account Type <span class="required-star" aria-hidden="true">*</span></label><select id="accountType" required><option value="">Select account type</option><option value="customer">Customer</option><option value="owner">Venue Owner</option></select></div><div class="form-group"><label for="password">Password <span class="required-star" aria-hidden="true">*</span></label><input type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" title="Use at least 8 characters, including a letter and a number." required></div><div class="form-group"><label for="confirmPassword">Confirm Password <span class="required-star" aria-hidden="true">*</span></label><input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="72" required></div><label class="checkbox"><input type="checkbox" id="terms" required><span>I agree to the Terms &amp; Conditions. <span class="required-star" aria-hidden="true">*</span></span></label><p id="registerError" class="form-description" style="color:#b42318"></p><button type="submit" class="primary-btn full-btn">Create Account</button></form><p class="auth-footer">Already have an account? <a href="login.html">Login</a></p></div></main><script src="script.js"></script></body></html>
