<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book Venue | VenueHub</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><a href="index.html" class="logo">Venue<span>Hub</span></a><nav><a href="index.html">Home</a><a href="venues.html">Venues</a><a href="dashboard.html">My Bookings</a></nav></header><main class="page-container"><div class="page-title"><div><p class="eyebrow">VenueHub Booking</p><h1>Book your venue</h1><p>Submit a booking request to the venue owner.</p></div></div><div class="booking-layout"><section class="booking-form card"><h2>Event Details</h2><form id="bookingForm"><input type="hidden" id="venueId"><div class="form-group"><label>Venue</label><select id="venue" required><option value="">Loading venues...</option></select></div><div class="form-row"><div class="form-group"><label>Event Date</label><input type="date" id="eventDate" required></div><div class="form-group"><label>Event Time</label><select id="eventTime" required><option value="">Select time</option><option>9:00 AM - 12:00 PM</option><option>10:00 AM - 1:00 PM</option><option>11:00 AM - 2:00 PM</option><option>12:00 PM - 3:00 PM</option><option>1:00 PM - 4:00 PM</option><option>2:00 PM - 5:00 PM</option><option>3:00 PM - 6:00 PM</option><option>4:00 PM - 7:00 PM</option><option>5:00 PM - 8:00 PM</option><option>6:00 PM - 9:00 PM</option><option>7:00 PM - 10:00 PM</option><option>8:00 PM - 11:00 PM</option></select></div></div><div class="form-row"><div class="form-group"><label>Number of Guests</label><input type="number" id="guestCount" min="1" max="100000" step="1" required><small id="capacityHint" class="form-description">Choose a venue to see its capacity.</small></div><div class="form-group"><label>Event Type</label><select id="eventType" required><option value="">Select event</option><option>Wedding</option><option>Reception</option><option>Birthday</option><option>Engagement</option><option>Corporate</option><option>Conference</option><option>Party</option><option>Other</option></select></div></div><div class="form-group"><label>Special Requirements</label><textarea id="requirements" rows="5" placeholder="Catering, decoration, parking, stage, etc."></textarea></div><h2 class="section-space">Contact Details</h2><div class="form-row"><div class="form-group"><label>Your Name</label><input type="text" id="customerName" required></div><div class="form-group"><label>Phone Number</label><input type="tel" id="customerPhone" required></div></div><div class="form-group"><label>Email</label><input type="email" id="customerEmail" required></div><p id="bookingError" class="form-description" style="color:#b42318"></p><button type="submit" class="primary-btn full-btn">Confirm Booking Request</button></form></section><aside class="booking-summary card"><div class="summary-image"><img id="bookingVenueImage" src="" alt="Venue"></div><div class="summary-content"><span class="status-badge">Selected Venue</span><h2 id="bookingVenueName">Select a venue</h2><p id="bookingVenueLocation" class="location"></p><hr><div class="summary-row"><span>Price</span><strong id="bookingVenuePrice">₹0</strong></div><div class="summary-row"><span>Guests</span><strong id="bookingGuestSummary">0</strong></div><div class="summary-row"><span>Estimated total</span><strong id="bookingTotal">₹0</strong></div></div></aside></div></main><script src="script.js"></script></body></html>
