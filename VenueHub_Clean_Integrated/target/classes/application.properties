spring.application.name=venuehub
server.port=8080
spring.datasource.url=${VENUEHUB_DB_URL:jdbc:mysql://localhost:3306/venuehub_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${VENUEHUB_DB_USERNAME:root}
spring.datasource.password=${VENUEHUB_DB_PASSWORD:2008}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.web.resources.cache.period=0
spring.jackson.serialization.write-dates-as-timestamps=false

# Optional SMTP settings for password recovery. Configure these environment variables to enable email delivery.
spring.mail.host=${VENUEHUB_SMTP_HOST:}
spring.mail.port=${VENUEHUB_SMTP_PORT:587}
spring.mail.username=${VENUEHUB_SMTP_USERNAME:}
spring.mail.password=${VENUEHUB_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
venuehub.mail.from=${VENUEHUB_SMTP_FROM:}

# Public base URL used in password-reset links (local development default)
venuehub.app.base-url=${VENUEHUB_APP_BASE_URL:http://localhost:8080}

# Google Identity Services OAuth web client ID (configure in Google Cloud Console)
